<!-- index.html — 常中天機 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="常中天機"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <title>常中天機</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css"/>

  <!-- iztro (紫微斗數排盤) -->
  <script src="https://cdn.jsdelivr.net/npm/iztro/dist/iztro.min.js"></script>
</head>
<body>

<!-- Toast notification -->
<div id="toast"></div>

<!-- Confetti / particle burst -->
<div id="confetti"></div>

<!-- Settings Modal -->
<div id="settings-modal">
  <div class="modal-box">
    <div style="font-size:16px;font-weight:900;color:var(--accent);margin-bottom:4px">API 金鑰配置</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:16px;line-height:1.9">選擇 AI 提供商並填入 API Key 啟用 AI 預測功能。</div>
    <div style="display:flex;gap:6px;margin-bottom:12px" id="ai-provider-tabs">
      <button onclick="setAIProvider('anthropic')" id="prov-anthropic" style="flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:700;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer">Claude</button>
      <button onclick="setAIProvider('deepseek')"  id="prov-deepseek"  style="flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:700;border:2px solid var(--border);background:var(--card);color:var(--text);cursor:pointer">DeepSeek</button>
      <button onclick="setAIProvider('grok')"      id="prov-grok"      style="flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:700;border:2px solid var(--border);background:var(--card);color:var(--text);cursor:pointer">Grok</button>
    </div>
    <div id="ai-provider-hint" style="font-size:10px;color:var(--sub);margin-bottom:8px">console.anthropic.com · 每次約HK$0.01</div>
    <input type="password" id="api-key-input" placeholder="sk-ant-api03-..." style="margin-bottom:16px"/>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="saveApiKey()">儲存</button>
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
    </div>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px">命盤資料</div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:8px">修改出生資料，更新命盤分析</div>
      <button class="btn btn-primary" onclick="closeSettings();editProfile();" style="width:100%">修改出生資料</button>
    </div>
  </div>
</div>

<!-- Onboarding / Birthday Modal (rendered by JS) -->
<div id="onboarding-modal" id="ob-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)">
  <div class="modal-box" id="ob-box"></div>
</div>

<!-- Mood check modal (injected by showMoodCheck) -->
<div id="mood-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99998;align-items:center;justify-content:center;padding:16px"></div>

<!-- ══ Header ══ -->
<div id="header">
  <div class="header-icon float">六合</div>
  <div class="title">
    <h1>常中天機</h1>
    <p>紫微垣下，四十九道幽光 <span style="opacity:0.4;font-size:8px">v20260319</span></p>
  </div>
  <div class="theme-btns">
    <button class="theme-btn active" id="btn-fun"    onclick="setTheme('fun')"    title="標準">術</button>
    <button class="theme-btn"        id="btn-dark"   onclick="setTheme('dark')"   title="夜間">暗</button>
    <button class="theme-btn"        id="btn-pastel" onclick="setTheme('pastel')" title="古典">古</button>
    <button class="font-btn theme-btn" data-scale="1"   onclick="setFont(1)"   title="標準字體" style="font-size:10px;font-weight:700;letter-spacing:-0.5px">A</button>
    <button class="font-btn theme-btn" data-scale="1.2" onclick="setFont(1.2)" title="大字體"   style="font-size:11px;font-weight:700;letter-spacing:-0.5px">A+</button>
    <button class="font-btn theme-btn" data-scale="1.5" onclick="setFont(1.5)" title="超大字體" style="font-size:12px;font-weight:700;letter-spacing:-0.5px">A++</button>
  </div>
  <div id="draw-info">
    <div class="draw" id="hdr-draw">--/---</div>
    <div class="date" id="hdr-date">----</div>
  </div>
</div>

<!-- ══ Celestial energy bar ══ -->
<div id="lucky-bar">
  <span>天機波動值</span>
  <div id="lucky-track"><div id="lucky-fill" style="transition:width 1s ease"></div></div>
  <span id="lucky-pct"></span>
  <span id="lucky-msg"></span>
</div>

<!-- ══ Tab navigation ══ -->
<div id="tabs">
  <button class="tab-btn active" data-tab="latest">玄數總覽</button>
  <button class="tab-btn" data-tab="workshop">推演工坊</button>
  <button class="tab-btn" data-tab="heatmap">熱力矩陣</button>
  <button class="tab-btn" data-tab="fortune">命盤推演</button>
  <button class="tab-btn" data-tab="alarm">天機提醒</button>
  <button class="tab-btn" data-tab="history">開獎記錄</button>
  <button class="tab-btn" data-tab="stats">數理統計</button>
  <button class="tab-btn" data-tab="checker">開獎核對</button>
  <button class="tab-btn" data-tab="mybets">個人籤注</button>
  <button class="tab-btn" data-tab="board">排行榜</button>
  <button class="tab-btn" data-tab="predict">數理預測</button>
  <button class="tab-btn" data-tab="discuss">玄數社區</button>
</div>

<!-- ══ Main content area (filled by render()) ══ -->
<div id="content"></div>

<!-- ══ Floating action button ══ -->
<button id="fab" onclick="openSettings()" style="position:fixed;bottom:20px;right:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#cc1840,#ff2e63);color:#fff;border:none;font-size:13px;font-weight:900;cursor:pointer;z-index:300;box-shadow:0 0 18px rgba(255,46,99,.6),0 4px 12px rgba(0,0,0,.5);letter-spacing:-.5px">設定</button>

<!-- ══ Scripts (load order matters) ══ -->
<script src="data.js"    defer></script>
<script src="utils.js"   defer></script>
<script src="ui-core.js" defer></script>
<script src="ui-tabs.js" defer></script>
<script src="app.js"     defer></script>

</body>
</html>
